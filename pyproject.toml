[project]
name = "outdoor-maps-plot"
version = "0.1.0"
description = "Create print-ready topographic posters from GPX tracks."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "pillow>=11.0,<13",
    "pymupdf>=1.25,<2",
    "reportlab>=4.2,<5",
]

[project.scripts]
outdoor-maps-plot = "outdoor_maps_plot.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/outdoor_maps_plot"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.uv]
package = true
