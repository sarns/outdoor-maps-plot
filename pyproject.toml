[project]
name = "outdoor-maps-plot"
version = "0.2.0"
description = "Create print-ready topographic posters from GPX tracks."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "defusedxml>=0.7,<1",
    "fastapi>=0.116,<1",
    "jinja2>=3.1,<4",
    "pillow>=11.0,<13",
    "pydantic>=2.11,<3",
    "pypdfium2>=4.30,<5",
    "python-multipart>=0.0.20,<1",
    "reportlab>=4.2,<5",
    "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
outdoor-maps-plot = "outdoor_maps_plot.cli:main"
outdoor-maps-web = "outdoor_maps_plot.web.app:main"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/outdoor_maps_plot"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.uv]
package = true
