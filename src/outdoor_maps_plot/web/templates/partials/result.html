<section id="render-result" class="render-result" aria-labelledby="result-heading"
         role="status" aria-live="polite" tabindex="-1" hidden>
  <div class="result-heading">
    <span class="result-check" aria-hidden="true">✓</span>
    <div>
      <strong id="result-heading">Poster ready</strong>
      <span id="result-filename"></span>
    </div>
  </div>
  <dl class="result-meta">
    <div><dt>Format</dt><dd id="result-format">—</dd></div>
    <div><dt>Size</dt><dd id="result-size">—</dd></div>
    <div><dt>Dimensions</dt><dd id="result-dimensions">—</dd></div>
  </dl>
  <div class="result-actions">
    <a id="download-result" class="button button--primary" href="#" download>
      Download poster
    </a>
    <button id="delete-result" class="button button--quiet" type="button">Delete</button>
  </div>
</section>
